<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#00d4ff;--secondary:#8b5cf6;--accent:#6d28d9;--bg:#0a0a0f;--bg-alt:#12121a;--bg-card:#1a1a2e;--text:#fff;--text-muted:#94a3b8;--border:#1e293b;--glass:rgba(255,255,255,0.05);--shadow:0 8px 32px rgba(0,0,0,0.4);--radius:16px;--radius-sm:10px;--transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);--fp:"Sora",sans-serif;--fs:"Inter",sans-serif}
html{scroll-behavior:smooth;font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}body{font-family:var(--fs);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;cursor:default}::selection{background:var(--primary);color:#000}
h1,h2,h3,h4,h5,h6{font-family:var(--fp);letter-spacing:-0.02em}h1{letter-spacing:-0.03em}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}ul{list-style:none}.container{max-width:1200px;margin:0 auto;padding:0 24px;position:relative}section{padding:100px 0;position:relative}
.section-label{font-family:var(--fp);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--primary);margin-bottom:12px;display:block}
.section-title{font-family:var(--fp);font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.15;margin-bottom:20px}
.section-title span,.highlight{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.section-desc{color:var(--text-muted);font-size:17px;max-width:600px;line-height:1.8}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:50px;font-family:var(--fp);font-weight:600;font-size:15px;border:none;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 25px rgba(0,212,255,0.3)}
.btn-primary:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 12px 50px rgba(0,212,255,0.55)}
.btn-outline{background:transparent;color:var(--text);border:2px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-5px) scale(1.04)}
.btn-whatsapp{background:#25d366;color:#fff}.btn-whatsapp:hover{background:#1da851;transform:translateY(-3px);box-shadow:0 8px 30px rgba(37,211,102,0.4)}
.btn-sm{padding:10px 20px;font-size:13px}
#loading{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s,visibility 0.8s}
#loading.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.loader-ring{width:80px;height:80px;border-radius:50%;border:3px solid rgba(0,212,255,0.1);border-top-color:var(--primary);border-bottom-color:var(--secondary);animation:spin 1s cubic-bezier(0.4,0,0.2,1) infinite;position:relative}
.loader-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(0,212,255,0.1);border-left-color:var(--secondary);border-right-color:var(--primary);animation:spin 1.5s cubic-bezier(0.4,0,0.2,1) infinite reverse}
.loader-logo{font-family:var(--fp);font-size:2.5rem;font-weight:900;margin-top:2rem;letter-spacing:6px;text-transform:uppercase}.loader-logo span{color:var(--primary)}
.loader-bar{width:200px;height:3px;background:var(--border);border-radius:3px;margin-top:1.5rem;overflow:hidden}
.loader-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));animation:loadBar 2s ease-in-out forwards}
.loader-tagline{color:var(--text-muted);font-size:.75rem;letter-spacing:4px;text-transform:uppercase;margin-top:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes loadBar{0%{width:0}50%{width:70%}100%{width:100%}}
#particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.cursor-dot{width:8px;height:8px;background:var(--primary);border-radius:50%;position:fixed;pointer-events:none;z-index:99999;transform:translate(-50%,-50%)}
.cursor-ring{width:40px;height:40px;border:2px solid rgba(0,212,255,0.3);border-radius:50%;position:fixed;pointer-events:none;z-index:99998;transition:all 0.15s ease-out;transform:translate(-50%,-50%)}
.cursor-ring.hover{width:60px;height:60px;border-color:var(--primary);background:rgba(0,212,255,0.06)}
nav{position:fixed;top:0;left:0;right:0;z-index:9999;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.6);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:all 0.4s}
nav.scrolled{background:rgba(10,10,15,0.95);backdrop-filter:blur(30px);padding:.6rem 2rem}
.nav-logo{display:flex;align-items:center;gap:.75rem;font-family:var(--fp);font-size:1.5rem;font-weight:800;letter-spacing:2px;text-transform:uppercase}.nav-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover}.nav-logo span{color:var(--primary)}
.nav-links{display:flex;gap:2rem;align-items:center}.nav-links a{font-size:.85rem;font-weight:500;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;transition:all 0.3s;position:relative}
.nav-links a::after{content:"";position:absolute;bottom:-4px;left:0;width:0;height:2px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width 0.3s}
.nav-links a:hover{color:var(--text)}.nav-links a:hover::after{width:100%}
.nav-cta{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:.6rem 1.5rem;border-radius:50px;font-size:.8rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;font-family:var(--fs)}

.mobile-toggle span{width:24px;height:2px;background:var(--text);border-radius:2px;transition:all 0.3s}
.mobile-toggle.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}.mobile-toggle.active span:nth-child(2){opacity:0}.mobile-toggle.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8rem 2rem 4rem;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}.hero-bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,212,255,0.12) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(139,92,246,0.1) 0%,transparent 60%)}
.hero-grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px}
.hero-content{position:relative;z-index:1;text-align:center;max-width:900px}
.hero-badge{display:inline-block;padding:.4rem 1.2rem;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.25);border-radius:50px;font-size:.75rem;color:var(--primary);letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem;backdrop-filter:blur(10px)}
.hero h1{font-family:var(--fp);font-size:clamp(2.5rem,6vw,5.5rem);font-weight:800;line-height:1.15;margin-bottom:1.5rem}
.hero p{font-size:clamp(1rem,2vw,1.25rem);color:var(--text-muted);max-width:600px;margin:0 auto 2.5rem;line-height:1.8}
.hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}.hero-stats{display:flex;gap:3rem;justify-content:center;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);flex-wrap:wrap}
.hero-stat{text-align:center}.hero-stat .num{font-family:var(--fp);font-size:2rem;font-weight:700}.hero-stat .label{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:.25rem}
.hero-scroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--text-muted);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;animation:float 3s ease-in-out infinite}
.hero-scroll .mouse{width:20px;height:32px;border:2px solid var(--border);border-radius:10px;position:relative}
.hero-scroll .mouse::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:3px;height:8px;background:var(--primary);border-radius:2px;animation:scrollWheel 1.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
@keyframes scrollWheel{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(10px)}}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.about-image{position:relative;border-radius:20px;overflow:hidden}.about-image img{width:100%;border-radius:20px;transition:transform 0.6s}.about-image:hover img{transform:scale(1.03)}
.about-image .exp-badge{position:absolute;bottom:-1rem;right:-1rem;background:linear-gradient(135deg,var(--primary),var(--secondary));padding:1.5rem;border-radius:16px;text-align:center;color:#fff;z-index:2;box-shadow:0 10px 40px rgba(0,212,255,0.35)}
.about-image .exp-badge .num{font-size:2rem;font-weight:800;font-family:var(--fp);display:block;line-height:1}

.about-text h3{font-family:var(--fp);font-size:1.8rem;font-weight:700;margin-bottom:1rem}.about-text p{color:var(--text-muted);line-height:1.8;margin-bottom:1.5rem;font-size:1rem}
.about-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-top:2rem;max-width:450px}

.about-stat-item .num{font-family:var(--fp);font-size:1.8rem;font-weight:800;color:var(--primary);display:block}.about-stat-item .label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.service-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;transition:var(--transition);position:relative;overflow:hidden}
.service-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));transform:scaleX(0);transform-origin:left;transition:transform 0.4s}
.service-card:hover::before{transform:scaleX(1)}.service-card:hover{transform:translateY(-8px);border-color:rgba(0,212,255,0.25);box-shadow:var(--shadow);background:rgba(0,212,255,0.04)}
.service-icon{width:60px;height:60px;border-radius:16px;background:rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;font-size:1.5rem;color:var(--primary);transition:var(--transition)}

.service-card .tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}.service-card .tags span{padding:.25rem .7rem;background:rgba(0,212,255,0.08);border-radius:50px;font-size:.7rem;color:var(--primary);font-weight:500}

.models-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
.model-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition);cursor:pointer}

.model-card-img{width:100%;height:220px;object-fit:cover;display:block;transition:transform 0.6s}.model-card:hover .model-card-img{transform:scale(1.06)}
.model-card-body{padding:1.5rem}.model-card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}

.model-card-meta{display:flex;gap:1.5rem;font-size:.75rem;color:var(--text-muted)}.model-card-meta i{margin-right:.3rem}
.model-img{width:100%;height:220px;object-fit:cover;display:block;transition:transform 0.6s;position:relative;overflow:hidden;background-size:cover;background-position:center}

.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}

.portfolio-card-img{width:100%;height:240px;object-fit:cover;transition:transform 0.6s}.portfolio-card:hover .portfolio-card-img{transform:scale(1.06)}

.portfolio-card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:.25rem}.portfolio-card-body p{color:var(--text-muted);font-size:.85rem}

.portfolio-info h3{font-size:1.1rem;font-weight:700;margin-bottom:.25rem}.portfolio-info p{color:var(--text-muted);font-size:.85rem}

@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.contact-form>*{position:relative;z-index:1}
.contact-form .form-group{margin-bottom:1.25rem;transition:var(--transition);position:relative}
.contact-form .form-group:hover{transform:translateX(4px)}
.contact-form .form-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;z-index:2;transition:all 0.3s;pointer-events:none}
.contact-form .form-group:focus-within .form-icon{color:var(--primary)}
.contact-form .form-group textarea~.form-icon{top:1.2rem;transform:none}
.contact-form .form-group input,.contact-form .form-group select,.contact-form .form-group textarea{padding-left:2.8rem}
.contact-form input,.contact-form textarea,.contact-form select{width:100%;padding:1rem 1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--fs);font-size:.9rem;transition:all 0.3s;outline:none;color:var(--text)}
.contact-form input:focus,.contact-form textarea:focus,.contact-form select:focus{border-color:var(--primary);background:rgba(0,212,255,0.03);box-shadow:0 0 0 3px rgba(0,212,255,0.08),0 4px 20px rgba(0,212,255,0.05);transform:translateY(-1px)}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:var(--text-muted);transition:opacity 0.3s}
.contact-form input:focus::placeholder,.contact-form textarea:focus::placeholder{opacity:0.4}
.contact-form textarea{height:120px;resize:vertical}
.contact-form select option{background:var(--bg-alt)}.contact-form button{width:100%}
.contact-form button i{transition:transform 0.3s}.contact-form button:hover i{transform:translateX(4px) rotate(-10deg)}
footer{background:var(--bg-alt);border-top:1px solid var(--border);padding:4rem 2rem 2rem;z-index:1}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2rem;max-width:1200px;margin:0 auto}
.footer-brand .nav-logo{margin-bottom:1rem;justify-content:flex-start}.footer-brand p{color:var(--text-muted);font-size:.85rem;line-height:1.6}
.footer-social{display:flex;gap:.75rem;margin-top:1.25rem}
.footer-social a{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:var(--transition);font-size:.9rem}
.footer-social a:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-3px)}
.footer-col h4{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:1.25rem}
.footer-col a{display:block;color:var(--text-muted);font-size:.85rem;margin-bottom:.75rem;transition:all 0.3s}
.footer-col a:hover{color:var(--primary);transform:translateX(4px)}
.footer-bottom{text-align:center;padding-top:2rem;margin-top:2rem;border-top:1px solid var(--border);color:rgba(255,255,255,0.25);font-size:.8rem}
.whatsapp-float{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 25px rgba(37,211,102,0.4);transition:var(--transition);animation:wppPulse 2s ease-in-out infinite}
.whatsapp-float:hover{transform:scale(1.1);box-shadow:0 8px 40px rgba(37,211,102,0.6)}
@keyframes wppPulse{0%,100%{box-shadow:0 4px 25px rgba(37,211,102,0.4)}50%{box-shadow:0 4px 45px rgba(37,211,102,0.7)}}
.back-to-top{position:fixed;bottom:5rem;right:1.5rem;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;font-size:1.1rem;opacity:0;visibility:hidden;transition:all 0.4s;box-shadow:0 4px 20px rgba(0,212,255,0.3)}
.back-to-top.visible{opacity:1;visibility:visible}.back-to-top:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,212,255,0.5)}
.demo-overlay{position:fixed;inset:0;z-index:99999;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.demo-overlay.active{display:flex}
.demo-header{background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;min-height:60px}
.demo-header .demo-logo{font-family:var(--fp);font-size:1.3rem;font-weight:900;letter-spacing:1px}
.demo-header .demo-logo span{color:var(--accent-color,var(--primary))}
.demo-header .demo-close{width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);font-size:1.2rem}
.demo-header .demo-close:hover{background:var(--primary);color:#000;transform:rotate(90deg)}
.demo-nav{display:flex;gap:.5rem;flex-wrap:wrap;padding:.85rem 2rem;background:var(--bg-alt);border-bottom:1px solid var(--border)}
.demo-nav a{padding:.5rem 1.2rem;border-radius:50px;font-size:.85rem;font-weight:600;color:var(--demo-muted,var(--text-muted));transition:all 0.3s;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px}
.demo-nav a:hover,.demo-nav a.active{background:rgba(0,212,255,0.1);color:var(--primary)}
.demo-body{padding:2rem;max-width:1100px;margin:0 auto;width:100%}
.demo-hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:2.5rem;min-height:480px;display:flex;align-items:center;justify-content:center;text-align:center}
.demo-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94)}
.demo-hero:hover .demo-hero-bg{transform:scale(1.05)}
.demo-hero-gradient{position:absolute;inset:0}
.demo-hero-content{position:relative;z-index:2;max-width:720px;padding:3rem 2rem}
.demo-hero-content .demo-hero-badge{display:inline-block;padding:.5rem 1.5rem;border-radius:50px;font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.demo-hero-content h1{font-family:var(--fp);font-size:clamp(2.5rem,5vw,4.2rem);font-weight:900;margin-bottom:1rem;line-height:1.1;letter-spacing:-0.03em}
.demo-hero-content p{color:rgba(255,255,255,0.8);font-size:1.2rem;max-width:620px;margin:0 auto 1.8rem;line-height:1.8}
.demo-hero-content .demo-hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.demo-section{margin-bottom:4rem;opacity:0;transform:translateY(30px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1)}
.demo-section h2{font-family:var(--fp);font-size:clamp(1.8rem,3.5vw,2.5rem);font-weight:800;margin-bottom:.75rem;text-align:center;letter-spacing:-0.02em}
.demo-section h2 span{color:var(--accent-color,var(--primary))}
.demo-section .section-desc{text-align:center;max-width:620px;margin:0 auto 2rem;color:var(--demo-muted,var(--text-muted));font-size:1rem;line-height:1.8}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.demo-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.5rem;transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);position:relative;overflow:hidden}
.demo-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--primary));transform:scaleX(0);transform-origin:left;transition:transform 0.4s}
.demo-card:hover::before{transform:scaleX(1)}
.demo-card:hover{transform:translateY(-8px);border-color:var(--accent-color,var(--primary));box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.demo-card .icon{width:52px;height:52px;border-radius:14px;background:rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:1.2rem;font-size:1.3rem;color:var(--accent-color,var(--primary));transition:all 0.4s}
.demo-card:hover .icon{background:var(--accent-color,var(--primary));color:#fff;transform:rotate(-5deg) scale(1.05)}
.demo-card h4{font-weight:800;margin-bottom:.5rem;font-size:1.15rem}
.demo-card p{color:var(--demo-muted,var(--text-muted));font-size:.9rem;line-height:1.7}
.demo-portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.5rem}
.demo-portfolio-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all 0.4s}
.demo-portfolio-card:hover{transform:translateY(-8px);border-color:var(--accent-color,var(--primary));box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.demo-portfolio-card .pf-img{width:100%;height:220px;object-fit:cover;transition:transform 0.6s}

.demo-portfolio-card .pf-body{padding:1.25rem 1.5rem 1.5rem}
.demo-portfolio-card .pf-body .pf-cat{font-size:.7rem;color:var(--accent-color,var(--primary));font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.4rem}
.demo-portfolio-card .pf-body h4{font-weight:800;font-size:1.1rem;margin-bottom:.4rem}
.demo-portfolio-card .pf-body p{color:var(--demo-muted,var(--text-muted));font-size:.88rem;line-height:1.6;margin-bottom:.75rem}
.demo-portfolio-card .pf-tech{display:flex;flex-wrap:wrap;gap:.4rem}
.demo-portfolio-card .pf-tech span{padding:.2rem .6rem;background:rgba(0,212,255,0.08);border-radius:50px;font-size:.65rem;color:var(--primary);font-weight:500}
.demo-prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.5rem}
.demo-prod-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all 0.4s;position:relative}
.demo-prod-card:hover{transform:translateY(-8px);border-color:var(--accent-color,var(--primary));box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.demo-prod-card .prod-badge{position:absolute;top:12px;left:12px;z-index:2;padding:.25rem .7rem;border-radius:50px;font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.demo-prod-card .prod-badge.promotion{background:#ef4444;color:#fff}
.demo-prod-card .prod-badge.new{background:var(--accent-color,var(--primary));color:#fff}
.demo-prod-card img{width:100%;height:190px;object-fit:cover;transition:transform 0.6s}
.demo-prod-card:hover img{transform:scale(1.06)}
.demo-prod-card .info{padding:1.25rem}
.demo-prod-card .info .prod-cat{font-size:.7rem;color:var(--demo-muted,var(--text-muted));letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.25rem}
.demo-prod-card .info h5{font-weight:800;font-size:1rem;margin-bottom:.25rem}
.demo-prod-card .info .prod-desc{color:var(--demo-muted,var(--text-muted));font-size:.82rem;line-height:1.5;margin-bottom:.5rem}
.demo-prod-card .info .prod-price{font-family:var(--fp);font-weight:900;font-size:1.3rem;color:var(--accent-color,var(--primary))}
.demo-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.5rem}
.demo-team-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.5rem;text-align:center;transition:all 0.4s}
.demo-team-card:hover{transform:translateY(-8px);border-color:var(--accent-color,var(--primary));box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.demo-team-card img{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 1rem;border:3px solid var(--accent-color,var(--primary));transition:transform 0.4s}
.demo-team-card:hover img{transform:scale(1.08)}
.demo-team-card h4{font-weight:800;font-size:1.05rem}
.demo-team-card .role{color:var(--demo-muted,var(--text-muted));font-size:.88rem;margin-bottom:.75rem}
.demo-team-card .social{display:flex;gap:.5rem;justify-content:center}
.demo-team-card .social a{width:32px;height:32px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:.7rem;transition:all 0.3s}
.demo-team-card .social a:hover{background:var(--accent-color,var(--primary));color:#fff;transform:translateY(-2px)}
.demo-timeline{position:relative;max-width:620px;margin:0 auto;padding-left:2rem}
.demo-timeline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border);border-radius:2px}
.demo-timeline-item{position:relative;padding:0 0 2.5rem 1.5rem}
.demo-timeline-item::before{content:"";position:absolute;left:-2.6rem;top:.15rem;width:14px;height:14px;border-radius:50%;background:var(--accent-color,var(--primary));border:3px solid var(--bg-card);box-shadow:0 0 0 2px var(--accent-color,var(--primary))}
.demo-timeline-item .year{font-family:var(--fp);font-size:.75rem;font-weight:700;color:var(--accent-color,var(--primary));letter-spacing:1px;text-transform:uppercase}
.demo-timeline-item h4{font-weight:800;font-size:1.1rem;margin:.2rem 0 .3rem}
.demo-timeline-item p{color:var(--demo-muted,var(--text-muted));font-size:.88rem;line-height:1.7}
.demo-partners{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;align-items:center}
.demo-partner{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.5rem;text-align:center;transition:all 0.3s;min-width:130px}
.demo-partner:hover{transform:translateY(-4px);border-color:var(--accent-color,var(--primary));box-shadow:0 8px 25px rgba(0,0,0,0.2)}
.demo-partner i{font-size:1.5rem;color:var(--accent-color,var(--primary));margin-bottom:.25rem;display:block}
.demo-partner span{font-size:.8rem;color:var(--demo-muted,var(--text-muted));font-weight:600}
.demo-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;max-width:700px;margin:0 auto}
.demo-stat{text-align:center;padding:1.75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;transition:all 0.4s}
.demo-stat:hover{transform:translateY(-6px);border-color:var(--accent-color,var(--primary));box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.demo-stat .num{font-family:var(--fp);font-size:2.5rem;font-weight:900;color:var(--accent-color,var(--primary));display:block}
.demo-stat .label{font-size:.8rem;color:var(--demo-muted,var(--text-muted));text-transform:uppercase;letter-spacing:1px}
.demo-testimonial{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;max-width:520px;margin:0 auto 1rem;transition:all 0.4s}

.demo-testimonial .stars{color:var(--accent-color,var(--primary));margin-bottom:.75rem;font-size:.9rem}
.demo-testimonial p{color:var(--demo-muted,var(--text-muted));font-size:.95rem;line-height:1.8;font-style:italic;margin-bottom:.75rem}
.demo-testimonial .author{font-weight:800;font-size:.9rem}
.demo-faq-item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:.75rem;overflow:hidden;transition:all 0.3s}
.demo-faq-item:hover{border-color:var(--accent-color,var(--primary))}
.demo-faq-q{padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:.95rem;background:none;border:none;width:100%;text-align:left;font-family:var(--fs);transition:color 0.3s}
.demo-faq-q:hover{color:var(--accent-color,var(--primary))}
.demo-faq-q i{transition:transform 0.3s;color:var(--text-muted)}
.demo-faq-q.active i{transform:rotate(180deg);color:var(--accent-color,var(--primary))}
.demo-faq-a{padding:0 1.5rem 1.25rem;color:var(--demo-muted,var(--text-muted));font-size:.9rem;line-height:1.7;display:none}
.demo-faq-q.active+.demo-faq-a{display:block}
.demo-contact-info{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:600px;margin:0 auto}
.demo-contact-item{text-align:center;padding:2rem;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;transition:all 0.4s}
.demo-contact-item:hover{transform:translateY(-6px);border-color:var(--accent-color,var(--primary));box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.demo-contact-item i{font-size:1.8rem;color:var(--accent-color,var(--primary));margin-bottom:.75rem;display:block}
.demo-contact-item h4{font-size:.95rem;font-weight:800;margin-bottom:.35rem}
.demo-contact-item p{color:var(--demo-muted,var(--text-muted));font-size:.9rem}
.demo-pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;max-width:850px;margin:0 auto}
.demo-price-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;transition:all 0.4s;position:relative}
.demo-price-card.popular{border-color:var(--accent-color,var(--primary));transform:scale(1.03);box-shadow:0 8px 30px rgba(0,0,0,0.2)}
.demo-price-card:hover{transform:translateY(-6px);border-color:var(--accent-color,var(--primary));box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.demo-price-card.popular:hover{transform:scale(1.03) translateY(-6px)}
.demo-price-card .popular-badge{display:inline-block;padding:.25rem 1rem;border-radius:50px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:.75rem}
.demo-price-card h4{font-weight:800;font-size:.95rem;color:var(--demo-muted,var(--text-muted));margin-bottom:.5rem}
.demo-price-card .price{font-family:var(--fp);font-size:2.5rem;font-weight:900;color:var(--accent-color,var(--primary));margin-bottom:.5rem}
.demo-price-card .price-desc{font-size:.88rem;color:var(--demo-muted,var(--text-muted));margin-bottom:1.25rem}

.demo-price-card ul li.disabled{color:rgba(255,255,255,0.12);text-decoration:line-through}

.demo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}

.demo-gallery img:hover{transform:scale(1.04)}
.demo-diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.5rem}

.demo-diff:hover{transform:translateY(-6px);border-color:var(--accent-color,var(--primary));box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.demo-diff .icon{width:60px;height:60px;border-radius:50%;background:rgba(0,212,255,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.4rem;color:var(--accent-color,var(--primary));transition:all 0.4s}
.demo-diff:hover .icon{background:var(--accent-color,var(--primary));color:#fff;transform:scale(1.1)}
.demo-diff h4{font-weight:800;font-size:1.05rem;margin-bottom:.35rem}
.demo-diff p{color:var(--demo-muted,var(--text-muted));font-size:.88rem;line-height:1.6}
.demo-cta-section{text-align:center;padding:3.5rem 2rem;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;margin-bottom:2rem}
.demo-cta-section h2{font-family:var(--fp);font-size:clamp(1.8rem,3vw,2.5rem);font-weight:900;margin-bottom:.75rem}
.demo-cta-section p{color:var(--demo-muted,var(--text-muted));font-size:1rem;max-width:560px;margin:0 auto 1.5rem;line-height:1.8}
.demo-cta-buttons{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}

.agency-style .demo-hero-content h1{font-family:var(--fp);font-size:clamp(3rem,6vw,5rem);font-weight:900;margin-bottom:1.5rem;line-height:1.05;letter-spacing:-0.03em;text-transform:uppercase}
.agency-style .demo-hero-content p{font-size:1.3rem;max-width:700px;margin-bottom:2.5rem;line-height:1.8;opacity:.85}
.agency-style .demo-hero-content .demo-hero-badge{font-size:.75rem;padding:.5rem 1.5rem;letter-spacing:4px;text-transform:uppercase;font-weight:600;margin-bottom:1.5rem;border-width:1px}

.pix-overlay{position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.pix-overlay.active{display:flex}.pix-popup{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);max-width:420px;width:100%;padding:2rem;position:relative;animation:popIn 0.3s ease}
@keyframes popIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.pix-popup .pix-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);font-size:1rem}
.pix-popup .pix-close:hover{background:var(--primary);color:#000}.pix-popup h3{font-family:var(--fp);font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:.25rem}

.pix-qr-wrap{display:flex;justify-content:center;margin-bottom:1.5rem}.pix-qr-wrap img{width:200px;height:200px;border-radius:12px;background:#fff;padding:8px}
.pix-amount{text-align:center;font-family:var(--fp);font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:1rem}
.pix-copy-btn{width:100%;padding:.8rem;border-radius:50px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-family:var(--fs);font-size:.9rem;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:.5rem}
.pix-copy-btn:hover{background:rgba(0,212,255,0.1);border-color:var(--primary)}.pix-copy-btn.copied{background:#10b981;border-color:#10b981;color:#fff}
.pix-footer{text-align:center;margin-top:1rem;font-size:.75rem;color:var(--text-muted)}
.fade-in{opacity:0;transform:translateY(40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}.fade-in.visible{opacity:1;transform:translateY(0)}
.fade-in-left{opacity:0;transform:translateX(-40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}.fade-in-left.visible{opacity:1;transform:translateX(0)}
.fade-in-right{opacity:0;transform:translateX(40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}.fade-in-right.visible{opacity:1;transform:translateX(0)}

function renderCatalog(){
  const g=document.getElementById("modelsGrid");if(!g)return;
  const f=document.getElementById("catalogFilters");if(f){
    const niches=[...new Set(models.map(m=>m.niche))];
    f.innerHTML=`<div class="catalog-filter active" data-filter="all">Todos</div>${niches.map(n=>`<div class="catalog-filter" data-filter="${n}">${n}</div>`).join("")}`;
    f.querySelectorAll(".catalog-filter").forEach(el=>el.addEventListener("click",function(){
      f.querySelectorAll(".catalog-filter").forEach(x=>x.classList.remove("active"));this.classList.add("active");
      const filter=this.dataset.filter;
      document.querySelectorAll("#modelsGrid .model-card").forEach(card=>{
        card.style.display=filter==="all"||card.dataset.niche===filter?"":"none"
      })
    }))
  }
  g.innerHTML=models.map(m=>`<div class="model-card fade-in" onclick="openDemo('${m.id}')" data-niche="${m.niche}" style="--accent:${m.color}"><div class="model-img" style="background-image:url('${m.img}');background-size:cover;background-position:center" onerror="handleBgError(this)"><div class="model-overlay"><span><i class="fas fa-eye"></i> Ver Demo</span></div></div><div class="model-badge">${m.niche}</div><div class="model-info"><h3>${m.name}</h3><p>${m.tagline}</p></div></div>`).join("")}

  const pixKey=PIX_KEY;const key=`01${String(pixKey.length).padStart(2,"0")}${pixKey}`;const acc=`0014br.gov.bcb.pix${key}`;const pay=[{id:"00",val:"01"},{id:"26",val:acc},{id:"52",val:"0000"},{id:"53",val:"986"},{id:"58",val:"BR"},{id:"59",val:SITE_NAME.substring(0,25)},{id:"60",val:"Sao Paulo"},{id:"62",val:"0503***"}];

function initParticles(){
  const c=document.getElementById("particles-canvas");if(!c)return;
  const ctx=c.getContext("2d");
  let w,h;const p=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener("resize",resize);
  for(let i=0;i<70;i++){p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+1})}
  function anim(){
    ctx.clearRect(0,0,w,h);
    p.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<0||pt.x>w)pt.vx*=-1;if(pt.y<0||pt.y>h)pt.vy*=-1;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fillStyle="rgba(0,212,255,0.2)";ctx.fill()});
    p.forEach((a,i)=>{for(let j=i+1;j<p.length;j++){const b=p[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,212,255,${0.08*(1-d/120)})`;ctx.lineWidth=0.5;ctx.stroke()}}});
    requestAnimationFrame(anim)
  }
  anim()
}

function initButtonRipple(){
  document.addEventListener("click",e=>{
    const btn=e.target.closest(".btn");
    if(!btn)return;
    const rect=btn.getBoundingClientRect();
    const el=document.createElement("span");
    el.className="btn-ripple-el";
    const size=Math.max(rect.width,rect.height);
    el.style.width=el.style.height=size+"px";
    el.style.left=e.clientX-rect.left-size/2+"px";
    el.style.top=e.clientY-rect.top-size/2+"px";
    btn.appendChild(el);
    setTimeout(()=>el.remove(),600)
  })
}

function getQueryParam(name){const p=new URLSearchParams(window.location.search);return p.get(name)}
document.addEventListener("DOMContentLoaded",()=>{
  renderServices();renderCatalog();renderPortfolio();renderPricing();renderBlog();renderFaq();
  initCounters();initFadeIns();initLoading();initCursor();initParticles();initNav();
  initButtonRipple();initImageReveal();initParallax();
  setTimeout(initScrollReveal,300);
  const demoOverlay=document.getElementById("demoOverlay");
  if(demoOverlay)demoOverlay.addEventListener("click",e=>{if(e.target===demoOverlay)closeDemoFull()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDemoFull();closePix()}});
  new ResizeObserver(()=>{document.querySelectorAll(".demo-hero-bg").forEach(el=>{el.style.transform="scale(1)"})}).observe(document.body);
  document.querySelectorAll(".fade-in,.fade-in-left,.fade-in-right").forEach(el=>{const d=parseFloat(el.style.transitionDelay)||0;el.style.transitionDelay=(d+0.08)+"s"});
  setTimeout(()=>openDemo("techcore"),100)
});
</script>
</body>
</html>
